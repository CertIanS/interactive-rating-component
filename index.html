<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Interactive rating component</title>

  <link rel="stylesheet" href="./styles.css">
  <link href='https://fonts.googleapis.com/css?family=Overpass' rel='stylesheet'>
  <script defer src="./main.js"></script>
</head>
<body>
  <main>
    <section id="rateState">
      <svg width="45" height="45" xmlns="http://www.w3.org/2000/svg">
        <circle r="20" cx="20" cy="20" fill="hsl(215, 14%, 34%)"/>
        <image x="10" y="10" width="20" height="20" href="./images/icon-star.svg" alt=""/>
      </svg>
      <form onsubmit="showThankYouMessage(event)">
        <header>
          <h1>How did we do?</h1>
          <p>Please let us know how we did with your support request. All feedback is appreciated to help us improve our offering!</p>
        </header>
        <section id="buttons">
          <button id="one" type="button" aria-label="One" onclick="changeRating(this.id)">1</button>
          <button id="two" type="button" aria-label="Two" onclick="changeRating(this.id)">2</button>
          <button id="three" type="button" aria-label="Three" onclick="changeRating(this.id)">3</button>
          <button id="four" type="button" aria-label="Four" onclick="changeRating(this.id)">4</button>
          <button id="five" type="button" aria-label="Five" onclick="changeRating(this.id)">5</button>
        </section>
        <button id="submit" type="submit" aria-label="Submit">SUBMIT</button>
      </form>
    </section>

    <section id="thankYouState">
      <img src="./images/illustration-thank-you.svg" alt="thank you"/>
      <p id="selected">You selected <span id="userRating"></span> out of 5</p>
      <header>
        <h1>Thank you!</h1>
        <p>We appreciate you taking the time to give a rating. If you ever need more support, 
    don’t hesitate to get in touch!</p>
      </header>
    </section>
  </main>
  
</body>
</html>
